name: quality
on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baseline and governance gates
        run: bash scripts/baseline-gate.sh

  pr-work-order:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind PR to architect-controlled Work Order
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          WORK_ORDER_ID="$(printf '%s\n' "$PR_TITLE" | grep -oE 'W[0-9]{3}' | head -n1 || true)"
          test -n "$WORK_ORDER_ID" || { echo 'WORK_ORDER_STATE_GATE_FAIL PR title must contain WORK-NNN'; exit 1; }
          WORK_ORDER_ID="$WORK_ORDER_ID" bash scripts/verify-work-order-state.sh
