[package]
name = "aeccad-core-geometry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# serde_json is a TEST-ONLY dependency. It never ships in the geometry runtime
# (WO-002-AC05 — no file-format dependency enters geometry): it exists solely
# to exercise Serialize/Deserialize round-trips in the test suite.
serde_json = "1"

[lints]
workspace = true
